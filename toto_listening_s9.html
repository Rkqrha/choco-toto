<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>또또 음성 인식 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#07121e;color:#e8faff;font-family:system-ui,'Malgun Gothic',sans-serif}.app{max-width:980px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}h1{font-size:18px;margin:0;color:#8bf0f5}.hint{font-size:11px;color:#a9c1d2}.screen{position:relative;width:100%;aspect-ratio:19.5/9;background:#101b29;border:2px solid #65dce8;border-radius:26px;overflow:hidden;box-shadow:inset 0 0 32px #0b3440,0 0 16px #12606a;cursor:pointer}.face{position:absolute;inset:0}.eye{position:absolute;top:32%;width:15%;height:40%;border-radius:50%;background:#7ce9f4;box-shadow:0 0 16px #4dd8eb;transition:all .2s}.eye.left{left:25%}.eye.right{right:25%}.shine{position:absolute;width:25%;height:28%;border-radius:50%;background:#f4ffff;right:17%;top:13%}.eye.blink{transform:scaleY(.09)}.mouth{position:absolute;left:45%;top:69%;width:10%;height:13%;border-bottom:7px solid #7ce9f4;border-radius:0 0 100px 100px;transition:all .16s}.symbol{position:absolute;right:7%;top:8%;font-size:clamp(22px,6vw,55px);font-weight:900;color:#86ebf4;text-shadow:0 0 12px #49d8e5;animation:bob 1.7s infinite ease-in-out}.cheek{position:absolute;top:75%;width:5%;height:5%;border-radius:100%;background:#ff91bb;opacity:.9}.cheek.left{left:20%}.cheek.right{right:20%}@keyframes bob{50%{transform:translateY(-6px)}}.eyes-happy .eye{height:22%;top:42%;background:transparent;border-top:8px solid #7ce9f4;border-radius:50% 50% 0 0;box-shadow:none}.eyes-happy .shine,.eyes-closed .shine,.eyes-think .shine,.eyes-angry .shine{display:none}.eyes-closed .eye{height:13%;top:49%;background:transparent;border-bottom:8px solid #7ce9f4;border-radius:0 0 50% 50%;box-shadow:none}.eyes-think .eye{width:13%;height:29%;top:40%;transform:translateX(15%)}.eyes-think .eye.left{left:29%}.eyes-think .eye.right{right:23%}.eyes-angry .eye{height:29%;top:44%;border-radius:45% 45% 55% 55%;transform:rotate(15deg)}.eyes-angry .eye.right{transform:rotate(-15deg)}.eyes-heart .eye{background:#ff93c5;clip-path:polygon(50% 92%,5% 42%,6% 18%,24% 6%,48% 25%,72% 6%,94% 18%,95% 42%);border-radius:0}.eyes-heart .shine{display:none}.eyes-x .eye{background:transparent;box-shadow:none}.eyes-x .eye:before,.eyes-x .eye:after{content:'';position:absolute;top:45%;left:0;width:100%;height:8px;border-radius:8px;background:#7ce9f4;transform:rotate(45deg)}.eyes-x .eye:after{transform:rotate(-45deg)}.eyes-x .shine{display:none}.mouth.open{border:0;background:#7ce9f4;border-radius:50%;height:22%;top:67%;width:9%;left:45.5%}.mouth.laugh{border:0;background:#7ce9f4;clip-path:ellipse(50% 47% at 50% 20%);height:24%;top:68%;width:14%;left:43%}.mouth.flat{height:0;border-bottom:7px solid #7ce9f4;border-radius:8px;top:77%}.mouth.sad{border-bottom:0;border-top:7px solid #7ce9f4;border-radius:100px 100px 0 0;top:76%}.mouth.tiny{border:0;background:#7ce9f4;border-radius:50%;width:3%;left:48.5%;height:5%;top:78%}.mouth.wiggle{border:0;height:8%;top:76%;background:#7ce9f4;clip-path:polygon(0 60%,15% 5%,30% 65%,45% 5%,60% 65%,75% 5%,90% 65%,100% 15%,100% 55%,90% 100%,75% 40%,60% 100%,45% 40%,30% 100%,15% 40%,0 100%)}.tear{position:absolute;left:36%;top:65%;font-size:clamp(15px,4vw,38px);color:#8aefff}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button,.grid button{background:#172c41;border:1px solid #3e687d;color:#e4f9ff;border-radius:13px;padding:10px 12px;font-size:14px;cursor:pointer}.controls button.active,.grid button.active{background:#24bfd4;color:#06202b;border-color:#79f7ff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{min-height:44px}.footer{font-size:12px;color:#a4bdc9;margin-top:10px}.full .top,.full .controls,.full .grid,.full .footer{display:none}.full .app{max-width:none;padding:0}.full .screen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}.full .eye{top:28%}.full .mouth{top:68%}@media(max-width:550px){.grid{grid-template-columns:repeat(3,1fr)}.controls button,.grid button{font-size:12px;padding:9px 6px}}@media(orientation:landscape) and (max-height:470px){.app{padding:6px}.top{margin-bottom:4px}.controls{margin:5px 0}.controls button,.grid button{padding:5px}.grid button{min-height:30px}.footer{margin-top:3px}}</style><style>
:root{--accent:#c8b1ff;--glow:#8a6fd0;--dark:#20162c;--light:#f0e9ff}
body{background:var(--dark);color:var(--light)}h1{color:var(--accent)}
.screen{background:#171321;border-color:var(--accent);box-shadow:inset 0 0 24px var(--glow)}
.eye{background:var(--accent);box-shadow:0 0 14px var(--glow)}.eyes-happy .eye{border-top-color:var(--accent)}.eyes-closed .eye{border-bottom-color:var(--accent)}
.eyes-x .eye:before,.eyes-x .eye:after,.mouth.open,.mouth.laugh,.mouth.tiny,.mouth.wiggle{background:var(--accent)}
.mouth,.mouth.flat{border-bottom-color:var(--accent)}.mouth.sad{border-top-color:var(--accent)}
.symbol{color:var(--accent);text-shadow:0 0 8px var(--glow)}.controls button,.grid button,.voice-panel button{background:#292238;border-color:#62506f;color:var(--light)}
.controls button.active,.grid button.active,.voice-panel button.active{background:var(--accent);color:#1d1425}
.eye,.mouth{transition:all .23s ease;border-width:6px}.mouth.laugh{clip-path:none;border:0;border-radius:18% 18% 48% 48%;height:20%;top:68%;width:13%;left:43.5%}
.voice-panel{border:1px solid #62506f;border-radius:16px;padding:12px;margin:10px 0;background:#211a2d}
.voice-panel h2{font-size:16px;margin:0 0 8px;color:var(--accent)}.voice-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.voice-panel button{border:1px solid #62506f;border-radius:12px;padding:10px 12px;font-size:14px;min-height:43px}
.status{font-size:14px;line-height:1.6}.status strong{color:var(--accent)}.heard{font-size:13px;color:#d5c9e0;word-break:keep-all}
.notice{font-size:12px;color:#d9cbdf;margin-top:7px;line-height:1.5}
.full .voice-panel{display:none}
</style></head><body><div class="app"><div class="top"><h1>✦ 또또 얼굴</h1><span class="hint" id="label">기본 미소</span></div><div class="screen" id="screen" title="화면을 누르면 전체 화면에서 돌아옵니다"><div class="face" id="face"><div class="eye left"><div class="shine"></div></div><div class="eye right"><div class="shine"></div></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth" id="mouth"></div><div class="symbol" id="symbol"></div><div class="tear" id="tear" hidden>💧</div></div></div><section class="voice-panel" aria-label="음성 인식 테스트"><h2>🎤 또또 부르면 반응하기</h2><div class="voice-row"><button id="listenStart" type="button">▶ 듣기 시작</button><button id="listenStop" type="button">■ 듣기 중지</button><button id="voiceTest" type="button">🔊 목소리 시험</button></div><div class="status">마이크 상태: <strong id="micStatus">대기 중</strong></div><div class="heard" id="heard">인식된 말: 아직 없음</div><div class="notice">먼저 '듣기 시작'을 누르고 마이크 권한을 허용해 주세요. “또또야, 안녕”처럼 말해 보세요. 화면을 켜 두어야 하며, 브라우저에 따라 음성 인식이 지원되지 않을 수 있어요. 음성은 이 프로그램에 저장하지 않아요.</div></section><div class="controls"><button id="fullscreen">⛶ 얼굴만 크게 보기</button><button id="demo">▶ 말하는 입 시험</button><button id="blink">✓ 눈 깜빡임 켜짐</button></div><div class="grid" id="buttons"></div><div class="footer">1단계: 표정·눈 깜빡임·입 움직임 테스트용. 아직 마이크나 AI 대화는 연결되지 않았어요. 얼굴만 보기 상태에서는 화면을 터치하면 돌아옵니다.</div></div><script>
var moods=[['기본 미소','normal','smile',''],['활짝 웃음','happy','laugh',''],['하트','heart','smile','♥'],['궁금해','normal','tiny','?'],['깜짝 놀람','normal','open','!'],['생각 중','think','tiny','···'],['신나요','happy','laugh','✦'],['졸려요','closed','tiny','Zzz'],['슬퍼요','normal','sad',''],['당황해','closed','wiggle','💧💦'],['아차!','x','flat','!'],['화났어','angry','sad','💢']];var selected=0,blinking=true,talking=false,blinkTimer=null,talkTimer=null;var face=document.getElementById('face'),mouth=document.getElementById('mouth'),symbol=document.getElementById('symbol'),tear=document.getElementById('tear'),buttons=document.getElementById('buttons');function render(){var m=moods[selected];face.className='face eyes-'+m[1];mouth.className='mouth '+(m[2]==='smile'?'':m[2]);symbol.textContent=m[3];symbol.style.color=(m[3]==='♥'||m[3]==='💢')?'#ff95c1':'#85edf5';tear.hidden=selected!==8;document.getElementById('label').textContent=m[0];Array.prototype.forEach.call(buttons.children,function(b,i){b.className=i===selected?'active':''})}moods.forEach(function(m,i){var b=document.createElement('button');b.textContent=m[0];b.onclick=function(){selected=i;render()};buttons.appendChild(b)});render();function blinkOnce(){if(!blinking||['happy','closed','x'].indexOf(moods[selected][1])>=0)return;var eyes=document.querySelectorAll('.eye');eyes.forEach(function(e){e.classList.add('blink')});setTimeout(function(){eyes.forEach(function(e){e.classList.remove('blink')})},170)}blinkTimer=setInterval(blinkOnce,3100);document.getElementById('blink').onclick=function(){blinking=!blinking;this.textContent=blinking?'✓ 눈 깜빡임 켜짐':'눈 깜빡임 꺼짐';this.className=blinking?'active':''};document.getElementById('demo').onclick=function(){talking=!talking;this.textContent=talking?'■ 말하기 멈춤':'▶ 말하는 입 시험';this.className=talking?'active':'';if(talkTimer)clearInterval(talkTimer);if(talking){var open=false;talkTimer=setInterval(function(){open=!open;mouth.className='mouth '+(open?'open':(moods[selected][2]==='smile'?'':moods[selected][2]))},260)}else render()};document.getElementById('fullscreen').onclick=function(){document.body.classList.add('full');if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){})}};document.getElementById('screen').onclick=function(){if(document.body.classList.contains('full')){document.body.classList.remove('full');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){})}};document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)document.body.classList.remove('full')});
</script><script>
(function(){
 var wake='또또', name='또또';
 var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
 var rec=null, want=false, listening=false, speaking=false, stoppingForSpeech=false, retry=null, mouthTimer=null, awaiting=false, lastText='', lastAt=0;
 var status=document.getElementById('micStatus'),heard=document.getElementById('heard');
 function state(s){status.textContent=s;}
 function restoreMouth(){if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null;} render();}
 function startMouth(){restoreMouth();var open=false;mouthTimer=setInterval(function(){open=!open;mouth.className='mouth '+(open?'open':'tiny');},240);}
 function scheduleRestart(){if(!want||speaking||retry)return;retry=setTimeout(function(){retry=null;startRec();},850);}
 function stopRec(){if(rec&&listening){try{rec.stop();}catch(e){}}}
 function say(msg,mood){
  if(typeof mood==='number'){selected=mood;render();}
  if(!window.speechSynthesis){state('이 브라우저는 음성 출력을 지원하지 않아요');return;}
  stoppingForSpeech=true;stopRec();
  try{window.speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(msg);u.lang='ko-KR';u.rate=name==='또또'?0.88:1.02;u.pitch=name==='또또'?1.25:1.12;
  u.onstart=function(){speaking=true;state('대답하는 중');startMouth();};
  function done(){speaking=false;restoreMouth();stoppingForSpeech=false;if(want){state('다시 듣기 준비 중');scheduleRestart();}else state('대기 중');}
  u.onend=done;u.onerror=done;
  try{window.speechSynthesis.speak(u);}catch(e){done();state('음성 출력 오류');}
 }
 function handle(t){
  var normalized=t.replace(/\s+/g,'').replace(/[.,!?~]/g,'');
  var called=normalized.indexOf(wake)>=0;
  if(called){awaiting=true;}
  if(!called&&!awaiting)return;
  if(called&&normalized===wake||normalized===wake+'야'||normalized===wake+'아'){
   awaiting=true;say('응! 나 여기 있어. 무슨 일이야?',0);return;
  }
  var reply=null, mood=0;
  if(/사랑해|좋아해/.test(normalized)){reply='나도 좋아해!';mood=2;}
  else if(/안녕|하이/.test(normalized)){reply='안녕! 오늘도 반가워!';mood=1;}
  else if(/놀자|놀이/.test(normalized)){reply='좋아! 우리 재미있게 놀자!';mood=6;}
  else if(/잘자|졸려/.test(normalized)){reply='잘 자! 좋은 꿈 꿔!';mood=7;}
  else if(/슬퍼|속상/.test(normalized)){reply='속상했구나. 무슨 일이 있었어?';mood=8;}
  else if(/화났|짜증/.test(normalized)){reply='화가 났구나. 천천히 이야기해 줘.';mood=11;}
  else if(/고마워/.test(normalized)){reply='나도 고마워!';mood=1;}
  if(reply){awaiting=false;say(reply,mood);}
  else if(called){awaiting=true;say('응! 듣고 있어. 안녕, 놀자, 사랑해 중 하나를 말해 줘!',0);}
 }
 function startRec(){
  if(!want||speaking||listening)return;
  if(!SpeechRec){state('음성 인식 미지원 — Chrome과 HTTPS 환경에서 시험해 주세요');want=false;return;}
  if(!rec){rec=new SpeechRec();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=false;
   rec.onstart=function(){listening=true;state('듣는 중 ● '+wake+'야, 라고 불러 주세요');};
   rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){
    if(!e.results[i].isFinal)continue;
    var t=e.results[i][0].transcript||'';heard.textContent='인식된 말: '+t;
    if(t===lastText&&Date.now()-lastAt<1800)continue;
    lastText=t;lastAt=Date.now();handle(t);
   }};
   rec.onerror=function(e){var error=e.error||'unknown';
    if(error==='not-allowed'||error==='service-not-allowed'){want=false;state('마이크 권한 거부 또는 음성 서비스 차단');}
    else if(error==='audio-capture'){want=false;state('마이크를 사용할 수 없어요');}
    else if(error==='network'){want=false;state('음성 인식 네트워크 오류 — 인터넷 연결 확인');}
    else if(error==='no-speech'){state('말소리가 들리지 않아요. 다시 시도 중');}
    else if(error!=='aborted'){state('인식 오류: '+error);}
   };
   rec.onend=function(){listening=false;if(want&&!speaking&&!stoppingForSpeech)scheduleRestart();};
  }
  try{rec.start();state('마이크 연결 중...');}catch(e){state('마이크 시작 실패: '+e.message);scheduleRestart();}
 }
 document.getElementById('listenStart').onclick=function(){want=true;awaiting=false;startRec();};
 document.getElementById('listenStop').onclick=function(){want=false;awaiting=false;if(retry){clearTimeout(retry);retry=null;}stopRec();state('듣기 중지됨');};
 document.getElementById('voiceTest').onclick=function(){say('안녕! 나는 '+name+'야. 만나서 반가워!',1);};
 if(!SpeechRec)state('이 브라우저는 음성 인식을 지원하지 않을 수 있어요');
 if(location.protocol==='file:'){
  document.querySelector('.notice').textContent+=' 현재 로컬 HTML 파일로 실행 중이에요. 이 환경에서는 음성 인식이 차단될 수 있어요. HTTPS로 게시한 뒤 실행하면 지원 여부를 더 정확히 확인할 수 있어요.';
 }
})();
</script></body></html>
